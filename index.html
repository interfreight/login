<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interfreight IT System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0D3B66,#1E5FA8);
}

.login-box{
background:white;
width:380px;
padding:35px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo h2{
color:#0D3B66;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
border:none;
background:#0D3B66;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#16528e;
}

.error{
margin-top:10px;
color:red;
text-align:center;
}

.success{
margin-top:10px;
color:green;
text-align:center;
}
.logo-container{
    text-align:center;
    margin-bottom:15px;
}

.logo-container img{
    width:120px;
    height:auto;
    display:block;
    margin:0 auto 10px auto;
}
</style>

</head>
<body>

<div class="login-box">

    <div class="logo-container">
        <img src="3. INTERFREIGHT COMPANY LOGO.png" alt="Interfreight Logo">
    </div>

    <div class="logo">
        <h2>INTERFREIGHT GROUP SYSTEM</h2>
        <p>User Login</p>
    </div>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://tuihpvykuqbqnfyfepql.supabase.co';

const SUPABASE_ANON_KEY =
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1aWhwdnlrdXFicW5meWZlcHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjg4OTcsImV4cCI6MjA5NzMwNDg5N30.HZKS8CgFLjkZ-Bx2AIjFjurH3IsKjvf37Ft852CzJsQ';

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);
async function login(){

    const username =
    document.getElementById("username").value.trim();

    const password =
    document.getElementById("password").value.trim();

    const message =
    document.getElementById("message");

    if(!username || !password){

        message.innerHTML =
        "<div class='error'>Please enter Username and Password</div>";

        return;
    }

    try{

       const { data, error } = await db
    .from('users')
    .select('*')
    .eq('username', username)
    .eq('password_hash', password);

console.log("DATA:", data);
console.log("ERROR:", error);
     if(error || data.length === 0){

            message.innerHTML =
            "<div class='error'>Invalid Username or Password</div>";

            return;
        }

        localStorage.setItem(
            "currentUser",
            JSON.stringify(data)
        );
const user = data[0];
console.log("USER:", user);
        // IT LOGIN
        if(user.role === "IT"){

            message.innerHTML =
            "<div class='success'>Welcome " +
            data.full_name +
            "</div>";

            setTimeout(() => {

                window.location.href =
                "https://interfreight.github.io/IT-Dashboard/";

            },1000);

            return;
        }

        // HR LOGIN
        if(user.role === "HR"){

            message.innerHTML =
            "<div class='success'>Welcome " +
            data.full_name +
            "</div>";

            setTimeout(() => {

                window.location.href =
                "https://interfreight.github.io/Hr_Dashboard/";

            },1000);

            return;
        }

        message.innerHTML =
        "<div class='error'>Access Denied.</div>";

    }catch(err){

        console.error(err);

        message.innerHTML =
        "<div class='error'>" + err.message + "</div>";

    }
}

document.addEventListener("keypress", function(e){

    if(e.key === "Enter"){
        login();
    }

});

</script>

</body>
</html>
