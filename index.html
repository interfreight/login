<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interfreight Login System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0D3B66,#1E5FA8);
}

.login-box{
background:white;
width:380px;
padding:35px;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo-container{
text-align:center;
margin-bottom:15px;
}

.logo-container img{
width:120px;
}

h2{
text-align:center;
color:#0D3B66;
}

p{
text-align:center;
margin-bottom:20px;
color:#555;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:12px;
border:none;
background:#0D3B66;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#16528e;
}

.error{
margin-top:10px;
color:red;
text-align:center;
}

.success{
margin-top:10px;
color:green;
text-align:center;
}
</style>

</head>
<body>

<div class="login-box">

<div class="logo-container">
<img src="3. INTERFREIGHT COMPANY LOGO.png" alt="Logo">
</div>

<h2>INTERFREIGHT SYSTEM</h2>
<p>User Login</p>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const db = window.supabase.createClient(
"https://tuihpvykuqbqnfyfepql.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1aWhwdnlrdXFicW5meWZlcHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3Mjg4OTcsImV4cCI6MjA5NzMwNDg5N30.HZKS8CgFLjkZ-Bx2AIjFjurH3IsKjvf37Ft852CzJsQ"
);

async function login(){

const username = document.getElementById("username").value.trim();
const password = document.getElementById("password").value.trim();
const message = document.getElementById("message");

if(!username || !password){
message.innerHTML = "<div class='error'>Please enter username and password</div>";
return;
}

try{

const { data, error } = await db
.from("users")
.select("*")
.eq("username", username)
.eq("password_hash", password);

if(error){
message.innerHTML = "<div class='error'>" + error.message + "</div>";
return;
}

if(!data || data.length === 0){
message.innerHTML = "<div class='error'>Invalid credentials</div>";
return;
}

const user = data[0];

// save session
localStorage.setItem("currentUser", JSON.stringify(user));

message.innerHTML = "<div class='success'>Welcome " + user.full_name + "</div>";
setTimeout(() => {

const role = String(user.role).trim();

if(role === "User"){

    window.location.href =
    "https://interfreight.github.io/employee_portal/";

}
else if(role === "IT"){

    window.location.href =
    "https://interfreight.github.io/IT-Dashboard/";

}
else if(role === "HR"){

    window.location.href =
    "https://interfreight.github.io/Hr_Dashboard/";
}
else if(role === "ADMIN"){

    window.location.href =
    "https://interfreight.github.io/Admin_Dashboard/";
}
else if(
    role === "TRANSPORT MANAGER" ||
    role === "OPERATIONS MANAGER" ||
    role === "SALES MANAGER" ||
    role === "ACCOUNTING MANAGER" ||
    role === "FORWARDING MANAGER"
){

    window.location.href =
    "https://interfreight.github.io/managers_portal/";

}
else{

    alert("Role not matched: " + role);

}

}, 800);

}
catch(err){
message.innerHTML = "<div class='error'>" + err.message + "</div>";
}
}

// ENTER KEY SUPPORT
document.addEventListener("keydown", function(e){
if(e.key === "Enter"){
login();
}
});
</script>

</body>
</html>
