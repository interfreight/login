/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    document.getElementById("loginContainer").style.display = "block";

    document.getElementById("registerContainer").style.display = "none";

    document.getElementById("message").innerHTML = "";

}


/* =====================================================
   SHOW REGISTRATION
===================================================== */

function showRegister(){

    document.getElementById("loginContainer").style.display = "none";

    document.getElementById("registerContainer").style.display = "block";

    document.getElementById("registerMessage").innerHTML = "";

/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("message");


    if(!username || !password){

        message.innerHTML =
            "<div class='error'>Please enter username and password</div>";

        return;
    }


    try{

        const { data, error } = await db

            .from("users")

            .select("*")

            .eq("username", username)

            .eq("password_hash", password);


        if(error){

            message.innerHTML =
                "<div class='error'>" +
                error.message +
                "</div>";

            return;
        }


        if(!data || data.length === 0){

            message.innerHTML =
                "<div class='error'>Invalid credentials</div>";

            return;
        }


        const user = data[0];


        /* CHECK ACCOUNT STATUS */

        if(
            user.status &&
            String(user.status).toLowerCase() !== "active"
        ){

            message.innerHTML =
                "<div class='error'>" +
                "Your account is not active yet. Please contact IT or HR." +
                "</div>";

            return;
        }


        /* SAVE SESSION */

        localStorage.setItem(
            "currentUser",
            JSON.stringify(user)
        );


        message.innerHTML =
            "<div class='success'>" +
            "Welcome " +
            user.full_name +
            "</div>";


        setTimeout(function(){

            const role =
                String(user.role || "").trim();


            if(role === "User"){

                window.location.href =
                    "https://interfreight.github.io/employee_portal/";

            }

            else if(role === "IT"){

                window.location.href =
                    "https://interfreight.github.io/IT-Dashboard/";

            }

            else if(role === "HR"){

                window.location.href =
                    "https://interfreight.github.io/Hr_Dashboard/";

            }

            else if(role === "ADMIN"){

                window.location.href =
                    "https://interfreight.github.io/Admin_Dashboard/";

            }

            else if(

                role === "TRANSPORT MANAGER" ||

                role === "OPERATIONS MANAGER" ||

                role === "SALES MANAGER" ||

                role === "ACCOUNTING MANAGER" ||

                role === "FORWARDING MANAGER"

            ){

                window.location.href =
                    "https://interfreight.github.io/managers_portal/";

            }

            else{

                alert(
                    "Role not matched: " +
                    role
                );

            }

        },800);


    }

    catch(err){

        console.error(err);

        message.innerHTML =
            "<div class='error'>" +
            err.message +
            "</div>";

    }

}


/* =====================================================
   REGISTER ACCOUNT
===================================================== */

async function registerAccount(){

    const fullName =
        document.getElementById("regFullName").value.trim();

    const username =
        document.getElementById("regUsername").value.trim();

    const email =
        document.getElementById("regEmail").value.trim();

    const department =
        document.getElementById("regDepartment").value.trim();

    const password =
        document.getElementById("regPassword").value;

    const confirmPassword =
        document.getElementById("regConfirmPassword").value;

    const message =
        document.getElementById("registerMessage");


    /* VALIDATION */

    if(
        !fullName ||
        !username ||
        !email ||
        !department ||
        !password ||
        !confirmPassword
    ){

        message.innerHTML =
            "<div class='error'>" +
            "Please complete all fields." +
            "</div>";

        return;
    }


    if(password.length < 6){

        message.innerHTML =
            "<div class='error'>" +
            "Password must be at least 6 characters." +
            "</div>";

        return;
    }


    if(password !== confirmPassword){

        message.innerHTML =
            "<div class='error'>" +
            "Passwords do not match." +
            "</div>";

        return;
    }


    try{

        /* CHECK USERNAME */

        const {
            data: existingUsername,
            error: usernameError
        } = await db

            .from("users")

            .select("id")

            .eq("username", username);


        if(usernameError){

            message.innerHTML =
                "<div class='error'>" +
                usernameError.message +
                "</div>";

            return;
        }


        if(
            existingUsername &&
            existingUsername.length > 0
        ){

            message.innerHTML =
                "<div class='error'>" +
                "Username already exists." +
                "</div>";

            return;
        }


        /* CHECK EMAIL */

        const {
            data: existingEmail,
            error: emailError
        } = await db

            .from("users")

            .select("id")

            .eq("email", email);


        if(emailError){

            message.innerHTML =
                "<div class='error'>" +
                emailError.message +
                "</div>";

            return;
        }


        if(
            existingEmail &&
            existingEmail.length > 0
        ){

            message.innerHTML =
                "<div class='error'>" +
                "Email address is already registered." +
                "</div>";

            return;
        }


        /* CREATE USER */

        message.innerHTML =
            "<div class='info'>" +
            "Creating your account..." +
            "</div>";


        const {
            data: newUser,
            error: insertError
        } = await db

            .from("users")

            .insert([{

                username: username,

                password_hash: password,

                full_name: fullName,

                email: email,

                role: "User",

                department: department,

                status: "active"

            }])

            .select(
                "id,username,full_name,email,department,role,status"
            )

            .single();


        if(insertError){

            message.innerHTML =
                "<div class='error'>" +
                insertError.message +
                "</div>";

            return;
        }


        /* CREATE EMPLOYEE PROFILE */

        const {
            error: profileError
        } = await db

            .from("employee_profiles")

            .insert([{

                user_id: newUser.id,

                department: department,

                profile_completed: false

            }]);


        if(profileError){

            console.warn(
                "Employee profile creation warning:",
                profileError.message
            );

        }


        /* SAVE USER */

        localStorage.setItem(
            "currentUser",
            JSON.stringify(newUser)
        );


        /* SUCCESS */

        message.innerHTML =
            "<div class='success'>" +

            "Account created successfully!<br>" +

            "Opening Employee Information Form..." +

            "</div>";


        /* REDIRECT */

        setTimeout(function(){

            window.location.href =
                "https://interfreight.github.io/employee_form/?id=" +
                encodeURIComponent(newUser.id);

        },1000);

    }

    catch(err){

        console.error(
            "Registration Error:",
            err
        );

        message.innerHTML =
            "<div class='error'>" +
            err.message +
            "</div>";

    }

}


/* =====================================================
   ENTER KEY SUPPORT
===================================================== */

document.addEventListener("keydown", function(e){

    if(e.key === "Enter"){

        const loginVisible =
            document.getElementById("loginContainer").style.display !== "none";


        if(loginVisible){

            login();

        }

    }

});
